[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# This matches the Dockerfile CMD. Railway records it explicitly so the
# production process cannot drift to monorepo auto-detection.
startCommand = "node dist/index.js"

# Database migrations are owned by sal-database. Explicitly clear any stale
# dashboard pre-deploy command; the slim runtime image intentionally contains
# only the compiled bot and its production dependencies.
preDeployCommand = []

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# SALbot is a singleton Discord gateway consumer. Do not overlap old and new
# deployments; give the existing SIGTERM handler time to disconnect cleanly.
overlapSeconds = 0
drainingSeconds = 30

healthcheckPath = "/healthz"
healthcheckTimeout = 120
