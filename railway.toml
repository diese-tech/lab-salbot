[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# This matches the Dockerfile CMD. Railway records it explicitly so the
# production process cannot drift to monorepo auto-detection.
startCommand = "node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# SALbot is a singleton Discord gateway consumer. Do not overlap old and new
# deployments; give the existing SIGTERM handler time to disconnect cleanly.
overlapSeconds = 0
drainingSeconds = 30

# No healthcheckPath is configured here. Readiness is tracked separately in
# https://github.com/diese-tech/lab-salbot/issues/45.
