name: Deploy Discord Commands

# Registering slash commands with Discord is a separate step from deploying
# the bot process itself (railway.toml intentionally clears preDeployCommand
# and ships a slim runtime image with no dev scripts — see
# docs/deployment/railway.md). Without this, a merged command can sit fully
# working in the bot's code and still not appear in Discord's command picker.
#
# This registers the full command set on every push to main. The Discord API
# call is idempotent (a full PUT of the command list), so re-running it when
# nothing changed is harmless.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-commands:
    name: Deploy Commands
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # DISCORD_TOKEN/DISCORD_CLIENT_ID/DISCORD_GUILD_ID live as environment
    # secrets/variables under "delightful-renewal / production" (Settings ->
    # Environments), the environment Railway's GitHub integration created —
    # note this is a DIFFERENT environment than the plain "production" one
    # also listed there, which is empty. Declaring the exact environment name
    # here is what makes its secrets/variables visible to secrets.*/vars.*
    # below; get it wrong (e.g. just "production") and every value silently
    # resolves empty instead of erroring.
    environment: "delightful-renewal / production"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @salbot/bot deploy:commands
        env:
          # DISCORD_TOKEN is the bot's actual credential — a repo Secret.
          # DISCORD_CLIENT_ID and DISCORD_GUILD_ID are public identifiers
          # (visible in the bot's invite URL / the server itself), not
          # secrets — repo Variables instead, per GitHub's own guidance on
          # not storing non-sensitive config as secrets.
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
